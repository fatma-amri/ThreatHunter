# Theme natif Streamlit — dark SOC moderne, sobre.
# Accent unique : rouge Keystone (#e01e2b), dose avec parcimonie.
# Severite geree par le CSS de dashboard/pages/theme.py (variables --sev-*).
[theme]
base = "dark"
primaryColor = "#e01e2b"
backgroundColor = "#0f1216"
secondaryBackgroundColor = "#161a20"
textColor = "#e6e9ef"
borderColor = "rgba(255,255,255,0.08)"
linkColor = "#ff6b73"
redColor = "#e01e2b"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "JetBrains Mono, monospace"
baseRadius = "medium"
buttonRadius = "small"
dataframeBorderColor = "rgba(255,255,255,0.10)"
dataframeHeaderBackgroundColor = "#1c222b"
showWidgetBorder = true
showSidebarBorder = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
